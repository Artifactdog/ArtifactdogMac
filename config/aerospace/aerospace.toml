config-version = 2

start-at-login = true
auto-reload-config = true

# Keep the window border service alive with AeroSpace.
after-startup-command = [
  'exec-and-forget borders'
]

# Keep nested containers intact so the launcher can build a real BSP tree.
# AeroSpace's `split opposite` is a no-op when flattening is enabled.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false
accordion-padding = 28
default-root-container-layout = 'tiles'
# Start with a left/right root; the launcher alternates nested orientation.
default-root-container-orientation = 'horizontal'
focus-follows-mouse.enabled = false

# Keep ordinary application windows tiled and apply the same focused-leaf BSP
# placement used by the Ghostty launcher. Utility panels remain floating.
[[on-window-detected]]
if = 'test %{app-name} = Ghostty'
run = 'layout tiling'

[[on-window-detected]]
if.app-name-regex-substring = '^(System Settings|Calculator|Karabiner-Elements|Raycast)$'
run = 'layout floating'

[[on-window-detected]]
if = 'true'
run = [
  'layout tiling',
  'exec-and-forget bash ~/.config/aerospace/smart-place-window.sh'
]

# Keep regular macOS Command shortcuts intact. Caps Lock is remapped to
# ctrl+alt+cmd by Karabiner and acts as the Linux-style Super/Hyper key.
[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.right = 12
outer.top = 7
outer.bottom = 12

[mode.main.binding]
# Focus
ctrl-alt-cmd-i = 'focus up'
ctrl-alt-cmd-j = 'focus left'
ctrl-alt-cmd-k = 'focus down'
ctrl-alt-cmd-l = 'focus right'

# Move windows
ctrl-alt-cmd-shift-i = 'move up'
ctrl-alt-cmd-shift-j = 'move left'
ctrl-alt-cmd-shift-k = 'move down'
ctrl-alt-cmd-shift-l = 'move right'

# Workspaces (numbers are the one intentional non-letter shortcut exception)
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'

# Send window to workspace (same number map, with Shift)
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'

# Monitors: D means display. Both commands cycle through connected monitors.
ctrl-alt-cmd-d = 'move-node-to-monitor --focus-follows-window --wrap-around next'
ctrl-alt-cmd-shift-d = 'move-workspace-to-monitor --wrap-around next'

# Fullscreen: native fullscreen is the default because it removes the title bar.
ctrl-alt-cmd-f = 'macos-native-fullscreen'
# Managed AeroSpace fullscreen remains available when avoiding a separate Space.
ctrl-alt-cmd-shift-f = 'fullscreen --no-outer-gaps'

ctrl-alt-cmd-e = 'layout floating tiling'
ctrl-alt-cmd-t = 'layout tiles horizontal vertical'
ctrl-alt-cmd-a = 'layout tiles'
ctrl-alt-cmd-b = 'balance-sizes'
ctrl-alt-cmd-p = 'workspace-back-and-forth'
ctrl-alt-cmd-w = 'close --quit-if-last-window'
ctrl-alt-cmd-enter = 'exec-and-forget bash ~/.config/aerospace/smart-open-ghostty.sh'
ctrl-alt-cmd-q = 'exec-and-forget bash ~/.config/aerospace/quit-focused-app.sh'
ctrl-alt-cmd-s = 'mode resize'

[mode.resize.binding]
j = 'resize width -50'
i = 'resize height -50'
k = 'resize height +50'
l = 'resize width +50'
s = 'resize smart -50'
b = 'resize smart +50'
r = 'mode main'
